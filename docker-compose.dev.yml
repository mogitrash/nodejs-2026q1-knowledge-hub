services:
  knowledge-hub:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: npm run start:dev
    ports:
      - 4000:4000
    restart: on-failure
    depends_on:
      - db
    healthcheck:
      test:
        ['CMD', 'curl', '-f', 'http://localhost:4000/doc', '||', 'exit', '1']
      interval: 10s
      timeout: 5s
    env_file: .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    volumes:
      - .:/app
      - /app/node_modules

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
    restart: unless-stopped

  adminer:
    image: adminer
    ports:
      - 8080:8080
    depends_on:
      - db
    profiles: [development]

volumes:
  postgres_data:
